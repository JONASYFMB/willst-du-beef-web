name: iPhone-Web-App veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: ZIP auspacken
        run: |
          unzip -o WillstDuBeef_Web.zip -d auspacken
          mkdir site
          cp auspacken/WillstDuBeef_Web/*.html auspacken/WillstDuBeef_Web/*.js auspacken/WillstDuBeef_Web/*.css \
             auspacken/WillstDuBeef_Web/*.png auspacken/WillstDuBeef_Web/*.webmanifest site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
